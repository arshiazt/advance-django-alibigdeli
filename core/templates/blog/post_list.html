<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Blog Post</h1>
    {% for post in posts %}
    <div>
        <a href="{% url 'blog:post-detail' pk=post.id %}"><h2>{{post.id}} - {{post.title}}</h2></a>
        <a href="{% url 'blog:post-edit' pk=post.id %}"><h2>Edit</h2></a>
    </div>
    {% endfor %}
</body>
</html>
